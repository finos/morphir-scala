# Subset of GitHub's GraphQL schema for morphir-connector-github.
#
# Hand-authored to name the operations this module will call. Not a copy of GitHub's full
# schema.docs.graphql. When codegen first runs, pin the upstream schema commit in README.md
# and regenerate from a cut-down SDL taken from that pin.
#
# Codegen (checked-in Scala, not a Mill task):
#   ./mill morphir/connector/github/schema/gen-client.scala

scalar URI
scalar ID
scalar DateTime

type Query {
  repository(owner: String!, name: String!): Repository
}

type Repository {
  issues(first: Int): IssueConnection
  pullRequests(first: Int): PullRequestConnection
  discussions(first: Int): DiscussionConnection
}

type Actor {
  login: String!
  url: URI!
}

type Label {
  name: String!
}

type LabelConnection {
  nodes: [Label!]!
}

type IssueComment {
  author: Actor
  body: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type IssueCommentConnection {
  nodes: [IssueComment!]!
}

type DiscussionComment {
  author: Actor
  body: String
  createdAt: DateTime!
  updatedAt: DateTime!
  upvoteCount: Int!
  replies(first: Int): DiscussionCommentConnection
}

type DiscussionCommentConnection {
  nodes: [DiscussionComment!]!
}

type IssueConnection {
  nodes: [Issue!]!
}

type PullRequestConnection {
  nodes: [PullRequest!]!
}

type DiscussionConnection {
  nodes: [Discussion!]!
}

type Issue {
  id: ID!
  number: Int!
  title: String!
  body: String
  url: URI!
  author: Actor
  createdAt: DateTime!
  updatedAt: DateTime!
  labels(first: Int): LabelConnection
  comments(first: Int): IssueCommentConnection
}

type PullRequest {
  id: ID!
  number: Int!
  title: String!
  body: String
  url: URI!
  author: Actor
  createdAt: DateTime!
  updatedAt: DateTime!
  labels(first: Int): LabelConnection
  comments(first: Int): IssueCommentConnection
}

type Discussion {
  id: ID!
  number: Int!
  title: String!
  body: String
  url: URI!
  author: Actor
  createdAt: DateTime!
  updatedAt: DateTime!
  upvoteCount: Int!
  labels(first: Int): LabelConnection
  answer: DiscussionComment
  comments(first: Int): DiscussionCommentConnection
}
