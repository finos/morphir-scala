extends: Module

object jvm:
  extends: [build.MorphirJVMModule, build.MorphirPublishModule, build.MorphirRootMvnDeps]
  packageDescription: "Deprecated: the classic ZIO-based Morphir library. Use morphir-model (code model and datamodel), morphir-naming and morphir-model-compat-v3 (v3 morphir-ir.json) instead."
  moduleDeps: [build.morphir.extensibility.jvm, build.morphir.naming.jvm]

object js:
  extends: [build.MorphirJSModule, build.MorphirPublishModule, build.MorphirRootMvnDeps]
  packageDescription: "Deprecated: the classic ZIO-based Morphir library. Use morphir-model (code model and datamodel), morphir-naming and morphir-model-compat-v3 (v3 morphir-ir.json) instead."
  moduleDeps: [build.morphir.extensibility.js, build.morphir.naming.js]
