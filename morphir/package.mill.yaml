extends: Module

object jvm:
  extends: [build.MorphirJVMModule, build.MorphirPublishModule, build.MorphirRootMvnDeps, build.EmptyDocJar]
  moduleDeps: [build.morphir.extensibility.jvm, build.morphir.naming.jvm]

object js:
  extends: [build.MorphirJSModule, build.MorphirPublishModule, build.MorphirRootMvnDeps, build.EmptyDocJar]
  moduleDeps: [build.morphir.extensibility.js, build.morphir.naming.js]

object main:
  extends: [build.MorphirCommonModule, build.MorphirPublishModule, build.AssemblyPublishInfo, build.MorphirCliBuildInfo, build.MorphirMainMvnDeps, build.MorphirSnapshotRepos]
  mainClass: org.finos.morphir.cli.MorphirCliMain
  moduleDeps:
  - build.morphir.jvm
  - build.morphir.runtime.classic.jvm
  - build.morphir.tools.jvm
