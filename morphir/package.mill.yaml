extends: Module

object jvm:
  extends: [build.MorphirJVMModule, build.MorphirPublishModule, build.MorphirRootMvnDeps, build.EmptyDocJar]
  moduleDeps: [build.morphir.extensibility.jvm, build.morphir.naming.jvm]

object js:
  extends: [build.MorphirJSModule, build.MorphirPublishModule, build.MorphirRootMvnDeps, build.EmptyDocJar]
  moduleDeps: [build.morphir.extensibility.js, build.morphir.naming.js]

object main:
  extends: [build.MorphirCommonModule, build.MorphirPublishModule, build.AssemblyPublishInfo, build.MorphirCliBuildInfo, build.MorphirMainMvnDeps, build.MorphirCliNativeImage]
  mainClass: org.finos.morphir.cli.MorphirCliMain
  compileModuleDeps:
  - build.morphir.web.server.jvm
  moduleDeps:
  - build.morphir.appkit.jvm
  - build.morphir.connector.github.jvm
  - build.morphir.jvm
  - build.morphir.runtime.classic.jvm
  - build.morphir.tools.jvm
  runModuleDeps:
  - build.morphir.web.server.jvm
  object test:
    extends: [ScalaTests, millbuild.KyoTest, build.MorphirKyoTestMvnDeps]
    moduleDeps: !append [build.morphir.web.server.jvm]
