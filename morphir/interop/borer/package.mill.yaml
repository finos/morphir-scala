extends: Module

object jvm:
  extends: [build.MorphirJVMModule, build.MorphirPublishModule, build.MorphirScoverage]
  packageDescription: "Deprecated: borer codecs for the classic datamodel. Use the datamodel and Kyo Schema codecs in morphir-model instead."
  moduleDeps: [build.morphir.jvm]
  mvnDeps:
  - io.bullet::borer-core
  - io.bullet::borer-derivation
  object test:
    extends: [ScoverageTests, TestModule.ZioTest]
    moduleDeps: !append
    - build.morphir.testing.generators.jvm
    - build.morphir.testing.zio.jvm
    mvnDeps:
    - io.bullet::borer-core
    - io.bullet::borer-derivation

object js:
  extends: [build.MorphirJSModule, build.MorphirPublishModule]
  packageDescription: "Deprecated: borer codecs for the classic datamodel. Use the datamodel and Kyo Schema codecs in morphir-model instead."
  moduleDeps: [build.morphir.js]
  mvnDeps:
  - io.bullet::borer-core
  - io.bullet::borer-derivation
