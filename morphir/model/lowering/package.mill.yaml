extends: Module

object jvm:
  extends: [build.MorphirJVMModule, build.MorphirPublishModule, build.MorphirKyoMvnDeps]
  packageDescription: "Deprecated: lowers classic v3 IR objects to the code model. Use V3Reader in morphir-model-compat-v3, which reads morphir-ir.json directly."
  moduleDeps: [build.morphir.model.jvm, build.morphir.jvm]
  object test:
    extends: [ScalaTests, millbuild.KyoTest, build.MorphirKyoTestMvnDeps, build.LoweringRealIrFixture]
    moduleDeps: !append [build.morphir.interop.zio.json.jvm]

object js:
  extends: [build.MorphirJSModule, build.MorphirPublishModule, build.MorphirKyoMvnDeps]
  packageDescription: "Deprecated: lowers classic v3 IR objects to the code model. Use V3Reader in morphir-model-compat-v3, which reads morphir-ir.json directly."
  moduleDeps: [build.morphir.model.js, build.morphir.js]
  object test:
    extends: [ScalaJSTests, build.MorphirJSTestNoSourceMap, millbuild.KyoTestJS, build.MorphirKyoTestMvnDeps]
    moduleKind: CommonJSModule
