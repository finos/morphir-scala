extends: Module

# Every test object carries the conformance-fixture plumbing (MorphirMarkdownConformance*): the CST round-trip
# suite in test/src reads the vendored CommonMark fixtures through kyo.Path on all platforms, exactly as the
# scalatags conformance harness does. The js and wasm test objects need node:fs to link — CommonJS for js
# (MorphirJSNodeModule); wasm is already ESModule, which imports node builtins natively.

object jvm:
  extends: [build.MorphirJVMModule, build.MorphirPublishModule, build.MorphirKyoCoreMvnDeps, build.MorphirKyoSchemaMvnDeps]
  moduleDeps: [build.morphir.langkit.core.jvm, build.morphir.prelude.jvm]
  object test:
    extends:
    - ScalaTests
    - millbuild.KyoTest
    - build.MorphirKyoTestMvnDeps
    - build.MorphirMarkdownConformanceMvnDeps
    - build.MorphirMarkdownConformanceEnv

object js:
  extends: [build.MorphirJSModule, build.MorphirPublishModule, build.MorphirKyoCoreMvnDeps, build.MorphirKyoSchemaMvnDeps]
  moduleDeps: [build.morphir.langkit.core.js, build.morphir.prelude.js]
  object test:
    extends:
    - ScalaJSTests
    - build.MorphirJSTestNoSourceMap
    - build.MorphirJSNodeModule
    - millbuild.KyoTestJS
    - build.MorphirKyoTestMvnDeps
    - build.MorphirMarkdownConformanceMvnDeps
    - build.MorphirMarkdownConformanceJsEnv

object native:
  extends: [build.MorphirNativeModule, build.MorphirPublishModule, build.MorphirKyoCoreMvnDeps, build.MorphirKyoSchemaMvnDeps]
  moduleDeps: [build.morphir.langkit.core.native, build.morphir.prelude.native]
  object test:
    extends:
    - ScalaNativeTests
    - millbuild.KyoTestNative
    - build.MorphirKyoTestMvnDeps
    - build.MorphirMarkdownConformanceMvnDeps
    - build.MorphirMarkdownConformanceEnv
    mvnDeps: !append
    - org.scala-native::test-interface::0.5.12

# WebAssembly linker variant; not a publish module. Exists so morphir/ui's wasm variant can compile concept bodies.
object wasm:
  extends: [build.MorphirWasmModule, build.MorphirKyoCoreMvnDeps, build.MorphirKyoSchemaMvnDeps]
  moduleDeps: [build.morphir.langkit.core.wasm, build.morphir.prelude.wasm]
  object test:
    extends:
    - ScalaJSTests
    - build.MorphirJSTestNoSourceMap
    - build.MorphirWasmTests
    - millbuild.KyoTestWasm
    - build.MorphirKyoTestMvnDeps
    - build.MorphirMarkdownConformanceMvnDeps
    - build.MorphirMarkdownConformanceJsEnv
