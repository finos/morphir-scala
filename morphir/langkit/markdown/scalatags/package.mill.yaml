extends: Module

# The conformance harness lives in the shared `test/src` tree and runs on all three platforms. It reads its
# vendored fixtures as files through kyo.Path, so every test object needs the fixture directory passed in
# (MorphirMarkdownConformance*Env) and the harness's own dependencies (MorphirMarkdownConformanceMvnDeps).

object jvm:
  extends: [build.MorphirJVMModule, build.MorphirPublishModule, build.MorphirKyoCoreMvnDeps]
  moduleDeps: [build.morphir.langkit.markdown.jvm]
  mvnDeps: !append
  - com.lihaoyi::scalatags:0.13.1
  object test:
    extends:
    - ScalaTests
    - millbuild.KyoTest
    - build.MorphirKyoTestMvnDeps
    - build.MorphirMarkdownConformanceMvnDeps
    - build.MorphirMarkdownConformanceEnv

object js:
  extends: [build.MorphirJSModule, build.MorphirPublishModule, build.MorphirKyoCoreMvnDeps]
  moduleDeps: [build.morphir.langkit.markdown.js]
  mvnDeps: !append
  - com.lihaoyi::scalatags::0.13.1
  object test:
    # MorphirJSNodeModule is on the test object alone: kyo.Path's JS backend imports node:fs, which cannot link
    # under Mill's default ModuleKind.NoModule, but only the harness needs it. Keeping the override off the
    # enclosing module leaves the published artifact NoModule, so downstream bundling is unaffected.
    extends:
    - ScalaJSTests
    - build.MorphirJSTestNoSourceMap
    - build.MorphirJSNodeModule
    - millbuild.KyoTestJS
    - build.MorphirKyoTestMvnDeps
    - build.MorphirMarkdownConformanceMvnDeps
    - build.MorphirMarkdownConformanceJsEnv

object native:
  extends: [build.MorphirNativeModule, build.MorphirPublishModule, build.MorphirKyoCoreMvnDeps]
  moduleDeps: [build.morphir.langkit.markdown.native]
  mvnDeps: !append
  - com.lihaoyi::scalatags::0.13.1
  object test:
    extends:
    - ScalaNativeTests
    - millbuild.KyoTestNative
    - build.MorphirKyoTestMvnDeps
    - build.MorphirMarkdownConformanceMvnDeps
    - build.MorphirMarkdownConformanceEnv
    mvnDeps: !append
    - org.scala-native::test-interface::0.5.12
