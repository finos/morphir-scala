extends: Module

object jvm:
  extends: [build.MorphirJVMModule, build.MorphirPublishModule, build.MorphirKyoCoreMvnDeps]
  moduleDeps: [build.morphir.langkit.markdown.jvm]
  mvnDeps: !append
  - io.getkyo::kyo-ui
  object test:
    extends: [ScalaTests, millbuild.KyoTest, build.MorphirKyoTestMvnDeps]

object js:
  extends: [build.MorphirJSModule, build.MorphirPublishModule, build.MorphirKyoCoreMvnDeps]
  moduleDeps: [build.morphir.langkit.markdown.js]
  mvnDeps: !append
  - io.getkyo::kyo-ui
  object test:
    extends: [ScalaJSTests, build.MorphirJSTestNoSourceMap, millbuild.KyoTestJS, build.MorphirKyoTestMvnDeps]

# No `native` variant. kyo-ui pulls kyo-net and kyo-http transitively on Scala Native, and their C sources need
# BoringSSL/OpenSSL symbols at link time (`_kyo_bssl_peer_cert_sha256_impl`, `_kyo_ossl_peer_cert_sha256_impl`),
# which this repository configures no linking options for. Tracked as its own issue; the browser writer has no
# Native consumer today, and the ScalaTags conformance oracle does publish for all three platforms.
