extends: Module

object jvm:
  extends: [build.MorphirJVMModule, build.MorphirPublishModule, build.MorphirKyoCoreMvnDeps]
  moduleDeps:
  - build.morphir.langkit.elm.core.jvm
  - build.morphir.langkit.trees.jvm
  mvnDeps: !append
  - com.github.plokhotnyuk.jsoniter-scala::jsoniter-scala-core:2.38.9
  - com.github.plokhotnyuk.jsoniter-scala::jsoniter-scala-macros:2.38.9
  object test:
    extends: [ScalaTests, millbuild.KyoTest, build.MorphirKyoTestMvnDeps]

object js:
  extends: [build.MorphirJSModule, build.MorphirPublishModule, build.MorphirKyoCoreMvnDeps]
  moduleDeps:
  - build.morphir.langkit.elm.core.js
  - build.morphir.langkit.trees.js
  mvnDeps: !append
  - com.github.plokhotnyuk.jsoniter-scala::jsoniter-scala-core::2.38.9
  - com.github.plokhotnyuk.jsoniter-scala::jsoniter-scala-macros::2.38.9
  object test:
    extends: [ScalaJSTests, millbuild.KyoTestJS, build.MorphirKyoTestMvnDeps]

# WebAssembly linker variant. Compiles the same sources as `js` and depends on the `js` modules of core/trees — only
# the Scala.js link output differs, so a `main.wasm` binary and an ES-module JS loader are emitted. Deliberately not a
# publish module: its Maven coordinate would collide with `js` (both carry the `_sjs1_3` suffix).
object wasm:
  extends: [build.MorphirWasmModule, build.MorphirKyoCoreMvnDeps]
  moduleDeps:
  - build.morphir.langkit.elm.core.js
  - build.morphir.langkit.trees.js
  mvnDeps: !append
  - com.github.plokhotnyuk.jsoniter-scala::jsoniter-scala-core::2.38.9
  - com.github.plokhotnyuk.jsoniter-scala::jsoniter-scala-macros::2.38.9
  object test:
    extends: [ScalaJSTests, build.MorphirWasmTests, millbuild.KyoTestWasm, build.MorphirKyoTestMvnDeps]

object native:
  extends: [build.MorphirNativeModule, build.MorphirPublishModule, build.MorphirKyoCoreMvnDeps]
  moduleDeps:
  - build.morphir.langkit.elm.core.native
  - build.morphir.langkit.trees.native
  mvnDeps: !append
  - com.github.plokhotnyuk.jsoniter-scala::jsoniter-scala-core::2.38.9
  - com.github.plokhotnyuk.jsoniter-scala::jsoniter-scala-macros::2.38.9
  object test:
    extends: [ScalaNativeTests, millbuild.KyoTestNative, build.MorphirKyoTestMvnDeps]
    mvnDeps: !append
    - org.scala-native::test-interface::0.5.12
