extends: Module

object js:
  extends: [build.MorphirJSModule, build.MorphirPublishModule, build.MorphirKyoCoreMvnDeps]
  moduleDeps: [build.morphir.prelude.js, build.morphir.langkit.markdown.kyo.ui.js]
  mvnDeps: !append
  - io.getkyo::kyo-ui
  - io.getkyo::kyo-jsonrpc
  - io.getkyo::kyo-schema
  - io.getkyo::kyo-schema-json
  object test:
    extends: [ScalaJSTests, build.MorphirJSTestNoSourceMap, millbuild.KyoTestJS, build.MorphirKyoTestMvnDeps]

# WebAssembly linker variant; not a publish module — see morphir/buildkit/core/package.mill.yaml for the reasoning,
# which applies unchanged here.
object wasm:
  extends: [build.MorphirWasmModule, build.MorphirKyoCoreMvnDeps]
  moduleDeps: [build.morphir.prelude.wasm, build.morphir.langkit.markdown.kyo.ui.wasm]
  mvnDeps: !append
  - io.getkyo::kyo-ui
  - io.getkyo::kyo-jsonrpc
  - io.getkyo::kyo-schema
  - io.getkyo::kyo-schema-json
  object test:
    extends: [ScalaJSTests, build.MorphirJSTestNoSourceMap, build.MorphirWasmTests, millbuild.KyoTestWasm, build.MorphirKyoTestMvnDeps]
