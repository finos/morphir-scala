name: CI

env:
  JDK_JAVA_OPTIONS: -XX:+PrintCommandLineFlags -Xss10M # JDK_JAVA_OPTIONS is _the_ env. variable to use for modern Java
  JVM_OPTS: -XX:+PrintCommandLineFlags -Xss10M # for Java 8 only (sadly, it is not modern enough for JDK_JAVA_OPTIONS)

on:
  pull_request:
    branches: ["main", "0.4.x"]
  push:
    branches: ["main", "0.4.x"]
    # A release runs in two phases. Pushing a tag is phase one — this workflow tests, packages,
    # verifies, and stages a *draft* GitHub release with the assets attached; nothing irreversible
    # happens here, and a draft can simply be deleted. Publishing that draft is phase two: the
    # human act that fires release-publish.yml, which promotes the release to Maven Central. This
    # workflow deliberately has no `release:` trigger — the promotion lives in that separate, slim
    # workflow precisely so publishing a release does not re-run the whole test and packaging
    # pipeline.
    tags: ["v*", "mill-plugins/v*"]
  workflow_dispatch:
    inputs:
      maven_central:
        description: >-
          Publish snapshots to Maven Central (Sonatype). Uncheck to stand the snapshot publish job
          down for this run. Release promotion has moved to the release-publish workflow, which
          carries its own switch.
        type: boolean
        default: true

# cancel older runs of a pull request;
# this will not cancel anything for normal git pushes
concurrency:
  group: cancel-old-pr-runs-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Scala and Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8
      - name: Lint code
        run: ./mill --ticker false -i ci.lint

  # FINOS requires every contributor to have a signed CLA, and an AI agent cannot sign one, so an agent must not
  # appear as an author, a committer or a co-author. AGENTS.md has stated that since the repository adopted agents;
  # until now nothing checked it, which left the rule resting on whoever wrote the commit having read the document.
  #
  # It also gives the claim an answer. Automated reviewers have reported this rule as violated on eleven pull
  # requests that satisfied it, each naming an author no commit carried. A green check here is the evidence that
  # settles it, and a red one names the commit and the field rather than asserting a violation in prose.
  commit-authorship:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          # Both sides of the range have to be present to list the commits the pull request adds.
          fetch-depth: 0

      - name: Check commit authorship
        # A pull request supplies its own base and head. A branch push supplies the commit it moved from, which is
        # the range that push added. Neither is available on a tag push (whose `before` is all zeros) or a manual
        # run, and the script falls back to the head commit alone rather than refusing to run — see its own comment
        # on why it never checks whole history.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # `main` is fetched explicitly because the script excludes commits already published there, and
        # actions/checkout does not guarantee the remote-tracking ref for a branch it did not check out.
        run: |
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main || true
          .github/scripts/check-commit-authorship.sh

  squire-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
      - name: Setup Scala and Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8
      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
      - name: Test Squire and release policy
        run: mise run test:squire
      - name: Check the independent-version-stream changelogs
        run: .claude/skills/squire/squire changelog check

  knowledge-base:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Scala and Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8
      # The kb skill is a self-contained Mill script; it needs a JVM and nothing else.
      # Provenance checks are skipped: they compare against reference checkouts under
      # .refs/, which is gitignored and therefore absent on a runner.
      # Mill resolves its workspace from the working directory, so this must run from the skill directory —
      # invoking the launcher from the repo root picks up the root build instead and resolves nothing.
      - name: Test the kb skill
        run: cd .claude/skills/kb && ./mill --ticker false KbTests.scala
      - name: Check knowledge base and intent
        run: |
          .claude/skills/kb/kb check --no-provenance
          .claude/skills/kb/kb intent check
      # Mirrored upstream sources are compared against sync.lock.yaml only. The other half of the comparison needs
      # .refs/, which is gitignored and absent here — same reason provenance is skipped above. What this does catch
      # is a mirrored file edited into a state it could not be exported from, which is the failure that matters.
      - name: Check mirrored upstream sources
        run: .claude/skills/kb/kb sync status --no-upstream --strict

  mill-morphir-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Scala and Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8
      - name: Cache verified Morphir tool downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/morphir-scala
          key: ${{ runner.os }}-morphir-tools-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}
      - name: Cache Mill capability outputs
        uses: actions/cache@v6
        with:
          path: |
            out/mill-plugins/morphir/
            !out/mill-plugins/morphir/**/testForked.dest/**
            !out/mill-plugins/morphir/**/testOnly.dest/**
          key: ${{ runner.os }}-mill-morphir-unit-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}-${{ github.sha }}
      - name: Run capability
        run: ./mill --ticker false -i -k 'mill-plugins.morphir.{toolchain,javascript,elm-tooling,core,elm}.__.test'

  mill-morphir-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [mill-morphir-unit]
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Scala and Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8
      - name: Cache verified Morphir tool downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/morphir-scala
          key: ${{ runner.os }}-morphir-tools-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}
      - name: Cache Mill capability outputs
        uses: actions/cache@v6
        with:
          path: |
            out/mill-plugins/morphir/
            !out/mill-plugins/morphir/**/testForked.dest/**
            !out/mill-plugins/morphir/**/testOnly.dest/**
          key: ${{ runner.os }}-mill-morphir-unit-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}-${{ github.sha }}
      - name: Run capability
        run: ./mill --ticker false -i mill-plugins.morphir.integration.test

  morphir-elm-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [mill-morphir-unit]
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Scala and Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8
      - name: Cache verified Morphir tool downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/morphir-scala
          key: ${{ runner.os }}-morphir-tools-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}
      - name: Restore Mill plugin outputs
        uses: actions/cache/restore@v6
        with:
          path: out/mill-plugins/morphir/
          key: ${{ runner.os }}-mill-morphir-unit-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}-${{ github.sha }}
      - name: Cache Mill capability outputs
        uses: actions/cache@v6
        with:
          path: |
            out/examples/morphir-elm-projects/
            out/morphir-elm/
          key: ${{ runner.os }}-mill-morphir-projects-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}-${{ github.sha }}
      - name: Run capability
        # morphir-elm's CLI intermittently dies with a fatal EBADF fd-close-on-GC crash
        # under Node 24 after generation succeeds (bead morphir-qki, finos/morphir-elm#1282).
        # The preload shim swallows exactly that error shape; the trigger is run-scoped
        # (a bad runner host fails all in-job retries), so retries alone do not cover it.
        # Mill caches successful tasks, so each retry re-runs only the crashed ones.
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/.github/scripts/ebadf-close-shim.cjs
        run: |
          for attempt in 1 2 3; do
            if ./mill --ticker false -i -k "examples.morphir-elm-projects.__.morphirIR" \
              + "morphir-elm.sdks.__.morphirIR"; then
              exit 0
            fi
            echo "morphirIR attempt ${attempt} failed; retrying crashed tasks"
          done
          exit 1

  runtime-generated-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [morphir-elm-projects]
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Scala and Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8
      - name: Cache verified Morphir tool downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/morphir-scala
          key: ${{ runner.os }}-morphir-tools-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}
      - name: Restore generated Morphir IR outputs
        uses: actions/cache/restore@v6
        with:
          path: |
            out/examples/morphir-elm-projects/
            out/morphir-elm/
          key: ${{ runner.os }}-mill-morphir-projects-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}-${{ github.sha }}
      - name: Cache Mill capability outputs
        uses: actions/cache@v6
        with:
          path: out/morphir/runtime/classic/jvm/test/
          key: ${{ runner.os }}-mill-runtime-generated-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}-${{ github.sha }}
      - name: Run capability
        run: ./mill --ticker false -i morphir.runtime.classic.jvm.test.generatedRuntimeFixtures

  runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [runtime-generated-fixtures]
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Scala and Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8
      - name: Cache verified Morphir tool downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/morphir-scala
          key: ${{ runner.os }}-morphir-tools-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}
      - name: Restore generated Morphir IR outputs
        uses: actions/cache/restore@v6
        with:
          path: |
            out/examples/morphir-elm-projects/
            out/morphir-elm/
          key: ${{ runner.os }}-mill-morphir-projects-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}-${{ github.sha }}
      - name: Cache Mill capability outputs
        uses: actions/cache@v6
        with:
          path: out/morphir/runtime/classic/jvm/test/
          key: ${{ runner.os }}-mill-runtime-generated-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}-${{ github.sha }}
      - name: Run capability
        run: |
          ./mill --ticker false -i morphir.runtime.classic.jvm.test.verifyRuntimeTestDiscovery
          ./mill --ticker false -i morphir.runtime.classic.jvm.test

  # Split from test-js-desktop (morphir-oyn): linking morphir.ui alongside the rest of the JS/Wasm
  # tree in one Mill daemon pushed the Scala.js linker past the 8 GB heap in .mill-jvm-opts, OOM-ing
  # inside the source-map printer. (Originally morphir.ui shared this split with morphir.desktop and
  # morphir.appkit.electron, which retired with the Electron UI — the desktop/web UI now lives at
  # finos/morphir-ui.) ci.testJs / ci.testJsWasmLink (ci/MorphirCi.mill) resolve the shared wildcards
  # once and split them by millbuild.JsTestSelectors so the two peaks land on two runners with two
  # daemons; "platform" here is everything *except* the desktop/UI subset that test-js-desktop takes.
  test-js:
    runs-on: ubuntu-latest
    # 45 rather than the 30 the other test jobs use. The "Run JS tests" step alone has finished in
    # under 15 minutes and has also exceeded 30 on the same branch with no JS sources changed, and a
    # timed-out job is reported as *cancelled*, which reads like an unrelated failure. Pull requests
    # always pay a cold build here: the JS build cache is keyed by the exact commit SHA and is only
    # saved on main, 0.4.x and tags, so a PR can never restore it.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: ["25"] # Note there is no need to actually run this for multiple JVM versions for JS
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Setup Scala and Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8

      - name: Run JS tests
        # Kept in step with .config/mise/tasks/test/js for the underlying selectors, but `-j 2`
        # rather than that task's `-j 4` default: a GitHub-hosted runner is smaller than a developer
        # machine and shares its 8 GB daemon heap (.mill-jvm-opts) with everything else on the box.
        # ci.testJs partitions the shared wildcard by millbuild.JsTestSelectors; "platform" is every
        # JS/Wasm test module except morphir.ui, which test-js-desktop covers instead.
        run: |
          ./mill --ticker false -i -k -j 2 ci.testJs --group platform

      - name: Link the WebAssembly variants
        # Serial on purpose: a Wasm `fullLinkJS` holds the largest working set of any task in this
        # job, and running several at once exhausted the daemon heap inside the linker's
        # BinaryWriter. Splitting it out keeps the test phase parallel while the links go one at a
        # time. See .config/mise/tasks/test/js.
        run: |
          ./mill --ticker false -i -k -j 1 ci.testJsWasmLink --group platform

      - name: Cache JS build output
        # when in master repo: all commits to main branch and all additional tags
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/0.4.x' || startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@v6
        with:
          path: |
            out/morphir/**/js/
          # The commit already identifies the output; the key does not hash `out`.
          # `hashFiles('out')` follows the symlinks Mill leaves there — `out/mill-home`
          # points at $HOME and `out/mill-daemon/mill-workspace` back at the repo root —
          # so it walks the whole runner home and a cyclical path, taking minutes when it
          # works and failing the job outright when it hits an unreadable file or the cycle.
          # `-platform` distinguishes this from test-js-desktop's own save under the same commit.
          key: ${{ runner.os }}-mill-js-platform-${{matrix.java}}-${{ github.sha }}

  # See test-js above for why this job exists (morphir-oyn): morphir.ui is the desktop/UI half of
  # the same JS/Wasm wildcard, split out by ci.testJs --group desktop so its link load lands on its
  # own runner and daemon. (morphir.desktop and morphir.appkit.electron shared this group before
  # retiring with the Electron UI — the desktop/web UI now lives at finos/morphir-ui.) The job and
  # its "desktop" group name are kept as-is rather than renamed now that morphir.ui is its sole
  # member.
  test-js-desktop:
    runs-on: ubuntu-latest
    # Kept in step with test-js's own reasoning for 45 rather than 30.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: ["25"] # Note there is no need to actually run this for multiple JVM versions for JS
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Setup Scala and Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8

      - name: Run JS tests (desktop/UI)
        # See test-js's "Run JS tests" step for the `-j 2` reasoning. "desktop" is morphir.ui, the
        # subset test-js excludes.
        run: |
          ./mill --ticker false -i -k -j 2 ci.testJs --group desktop

      - name: Link the WebAssembly variants (desktop/UI)
        # Serial for the same reason as test-js's own Wasm link step.
        run: |
          ./mill --ticker false -i -k -j 1 ci.testJsWasmLink --group desktop

      - name: Cache JS build output
        # when in master repo: all commits to main branch and all additional tags
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/0.4.x' || startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@v6
        with:
          path: |
            out/morphir/**/js/
          # See test-js's own cache step; `-desktop` distinguishes this save under the same commit.
          key: ${{ runner.os }}-mill-js-desktop-${{matrix.java}}-${{ github.sha }}

  # Scala Native is currently scoped to the langkit and kit modules ported from
  # krueger, plus buildkit/core and prelude. It gets its own job rather than riding along
  # with test-jvm because it needs libuv and links a binary per test module,
  # which is slower than the JVM run and unrelated to it — a native linker
  # failure should be legible on its own.
  test-native:
    runs-on: ubuntu-latest
    # 60 rather than 45, and 45 rather than 30 before that, for the same reason test-js carries 45:
    # this job links a binary per test module and grows whenever a module gains a native variant.
    # `test:native` runs at `-j 2` because the Mill daemon heap, not the core count, is the limit —
    # that file carries the full history and the two settings must move together.
    #
    # A timed-out job is reported as *cancelled*, which reads like unrelated infrastructure flake
    # rather than a job that needed more minutes. Worse, a daemon `OutOfMemoryError` mid-run wedges
    # the job rather than failing it, so it also lands here as a cancellation on exactly the limit.
    # Before raising this number again, read the log for `OutOfMemoryError`: more minutes do not fix
    # a heap that is already exhausted.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        java: ["25"]
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Scala and Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}

      - name: Cache scala dependencies
        uses: coursier/cache-action@v8

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Install native dependencies
        # Bounded: a stalled Ubuntu mirror otherwise consumes the job budget. The script skips the
        # Azure archive (see actions/runner-images#12949) rather than waiting on it.
        timeout-minutes: 6
        run: .github/scripts/install-native-deps.sh

      # Reuse of this job's own native build output. Unlike test-js's cache, which is save-only and
      # restored by `publish` rather than by test-js itself, this both restores and saves, so a
      # re-run of the same commit does not relink from scratch — the case that follows a timeout or
      # an infrastructure flake, which is how bead morphir-dru was opened.
      #
      # It is deliberately exact-commit only. See the key below for what happened when it was not.
      - name: Cache Native build output
        uses: actions/cache@v6
        with:
          path: |
            out/morphir/**/native/
          # Keyed by the exact commit, with no restore-keys fallback. A cross-commit restore was
          # tried and reverted: it made this job reuse a `nativeLink` from a different commit, and
          # 11 GithubClientTests snapshot assertions failed because a stale binary ran against
          # current sources. The first run of that branch passed (empty cache) and the second failed
          # (restored the first's output) — same configuration, so the restore was the only
          # variable. Mill's own input hashing does not protect against this, because the restored
          # task metadata is what tells Mill the work is already done.
          #
          # What remains is reuse across re-runs of the same commit, which is exactly the case that
          # follows a timeout or an infrastructure flake. Cold runs stay cold; see bead morphir-dru.
          #
          # `github.ref_name` is part of the key because the commit alone does not identify a run.
          # GitHub lets any branch read a cache written on the default branch, and a fast-forward
          # `main`-to-`develop` sync left both branches on one commit — so `develop`'s *first*
          # run restored `main`'s entry on a fresh runner and failed exactly as the reverted
          # cross-commit restore did: the same 11 GithubClientTests assertions, this time
          # `SnapshotNotFound`, because `out/morphir/**/native/` carries the task metadata that
          # tells Mill the work is done while the no-daemon sandbox holding the blessed snapshots
          # is not cached. Proven at f83f27b4 on 2026-08-19: `main` cold gave 81 passed / 0 failed,
          # `develop` restoring that entry gave 70 / 11, and a cold re-run gave 81 / 0 again.
          # `develop` has since been retired, but the reason holds for any two refs sharing one
          # commit — a release branch cut from `main`, or a re-run of the same SHA. The ref keeps
          # them apart while a re-run still hits its own entry. See bead morphir-8qz;
          # the other Mill build-output caches in this file share the unscoped shape and have not
          # yet been changed.
          key: ${{ runner.os }}-mill-native-${{ matrix.java }}-${{ github.ref_name }}-${{ github.sha }}

      - name: Run Native tests
        # Runs the mise task rather than repeating its Mill invocation here, as test-jvm does with
        # test:jvm-platform. This step used to carry its own copy, "kept in step with" that task by
        # hand — and it drifted: the copies disagreed about `-j`, so a fix applied to one of them
        # did nothing to the other, and the comments each described a setting the other file had.
        # One command, one place. The task owns the batching and the selectors; see it for why the
        # links are batched at all.
        run: mise run test:native

  test-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ["25"]
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Scala and Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Run JVM tests
        run: ./mill --ticker false -i ci.testJvm

      - name: Cache JVM build output
        # when in master repo: all commits to main branch and all additional tags
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/0.4.x' || startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@v6
        with:
          path: |
            out/morphir/**/jvm/
            out/morphir/build/
          # See the JS job: the key deliberately does not hash `out`.
          key: ${{ runner.os }}-mill-jvm-${{matrix.java}}-${{ github.sha }}

  cli-matrix:
    if: github.repository == 'finos/morphir-scala' && (startsWith(github.ref, 'refs/tags/v') || vars.MORPHIR_CI_PACKAGE_CLI != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      platforms: ${{ steps.matrix.outputs.platforms }}
    steps:
      - name: Compute the CLI packaging matrix
        id: matrix
        shell: bash
        # Only a v* tag — a release, however it is triggered — packages all five platforms. Branch
        # pushes and pull requests get the three-OS smoke matrix: each leg covers toolchain
        # machinery the others do not, and what a merge to main defers is only the second
        # architecture of an already-covered operating system. Five GraalVM native-image builds per
        # ordinary merge would be paid on every merge for assets nothing publishes.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            MATRIX='{"include":[{"token":"mac-aarch64","runner":"macos-14"},{"token":"mac-amd64","runner":"macos-15-intel"},{"token":"linux-amd64","runner":"ubuntu-24.04"},{"token":"linux-aarch64","runner":"ubuntu-24.04-arm"},{"token":"win-amd64","runner":"windows-latest"}]}'
            PLATFORMS="mac-aarch64,mac-amd64,linux-amd64,linux-aarch64,win-amd64"
          else
            MATRIX='{"include":[{"token":"linux-amd64","runner":"ubuntu-24.04"},{"token":"win-amd64","runner":"windows-latest"},{"token":"mac-aarch64","runner":"macos-14"}]}'
            PLATFORMS="linux-amd64,win-amd64,mac-aarch64"
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "platforms=$PLATFORMS" >> "$GITHUB_OUTPUT"

  cli-package-native:
    if: github.repository == 'finos/morphir-scala' && (startsWith(github.ref, 'refs/tags/v') || vars.MORPHIR_CI_PACKAGE_CLI != 'false')
    needs: [ci, cli-matrix]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cli-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      MORPHIR_CLI_RELEASE_DIR: .dev/dist/cli/release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: "true"

      - name: Cache Scala dependencies
        uses: coursier/cache-action@v8

      - name: Package and smoke-test the native CLI
        shell: pwsh
        run: |
          if ($IsWindows) {
            & ./mill.bat --ticker false -i ci.cli.packageNative --platform "${{ matrix.token }}"
          } else {
            & ./mill --ticker false -i ci.cli.packageNative --platform "${{ matrix.token }}"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and smoke-test the Elm MEP native image
        shell: pwsh
        run: |
          if ($IsWindows) {
            & ./mill.bat --ticker false -i morphir.langkit.elm.compiler.mep.jvm.nativeImageSmoke
          } else {
            & ./mill --ticker false -i morphir.langkit.elm.compiler.mep.jvm.nativeImageSmoke
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload native CLI package
        uses: actions/upload-artifact@v7
        with:
          name: cli-native-${{ matrix.token }}
          path: ${{ env.MORPHIR_CLI_RELEASE_DIR }}/*
          if-no-files-found: error

  cli-package-jvm:
    if: github.repository == 'finos/morphir-scala' && (startsWith(github.ref, 'refs/tags/v') || vars.MORPHIR_CI_PACKAGE_CLI != 'false')
    needs: [ci, cli-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MORPHIR_CLI_RELEASE_DIR: .dev/dist/cli/release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin

      - name: Cache Scala dependencies
        uses: coursier/cache-action@v8

      - name: Package and smoke-test the executable JVM assembly
        run: ./mill --ticker false -i ci.cli.packageJvm

      - name: Upload JVM CLI package
        uses: actions/upload-artifact@v7
        with:
          name: cli-jvm
          path: ${{ env.MORPHIR_CLI_RELEASE_DIR }}/*
          if-no-files-found: error

  cli-verify:
    if: github.repository == 'finos/morphir-scala' && (startsWith(github.ref, 'refs/tags/v') || vars.MORPHIR_CI_PACKAGE_CLI != 'false')
    needs: [cli-matrix, cli-package-native, cli-package-jvm]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MORPHIR_CLI_RELEASE_DIR: .dev/dist/cli/release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin

      - name: Cache Scala dependencies
        uses: coursier/cache-action@v8

      - name: Download CLI packages
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: ${{ env.MORPHIR_CLI_RELEASE_DIR }}
          merge-multiple: true

      - name: Verify CLI packages and checksums
        run: ./mill --ticker false -i ci.cli.verify --platforms "${{ needs.cli-matrix.outputs.platforms }}"

  cli-release:
    # Pull requests and branch pushes package and verify the CLI, but never receive a write token
    # or upload assets. Staging happens for a root v* tag — pushed bare, or chosen as the ref of a
    # manual dispatch; github.ref carries the tag in both cases. ci.cli.githubRelease creates the
    # GitHub release as a *draft* when none exists yet and attaches the assets; publishing that
    # draft is the human promotion act, and it is what fires release-publish.yml for the Maven
    # Central side. Pushing a v* tag requires write access, which is the authorization this job
    # relies on; the tag namespace check keeps mill-plugins/v* tags out.
    if: github.repository == 'finos/morphir-scala' && startsWith(github.ref, 'refs/tags/v')
    needs: [cli-matrix, cli-package-native, cli-package-jvm, cli-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency: publish-cli-${{ github.sha }}
    env:
      MORPHIR_CLI_RELEASE_DIR: .dev/dist/cli/release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin

      - name: Cache Scala dependencies
        uses: coursier/cache-action@v8

      - name: Download CLI packages
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: ${{ env.MORPHIR_CLI_RELEASE_DIR }}
          merge-multiple: true

      - name: Verify and stage CLI packages on the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./mill --ticker false -i ci.cli.verify --platforms "${{ needs.cli-matrix.outputs.platforms }}"
          ./mill --ticker false -i ci.cli.githubRelease --tag "${{ github.ref_name }}"

      # Staging is not done until the staged assets check out: download every asset fresh from the
      # release and verify it against the uploaded checksums.txt, so a truncated or mislabeled
      # upload fails this run instead of a user's install.
      - name: Verify the staged release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mill --ticker false -i ci.cli.verifyRelease --tag "${{ github.ref_name }}" --platforms "${{ needs.cli-matrix.outputs.platforms }}"

  publish:
    # Snapshots and branch milestones only: all commits to main (snapshot, both areas) and 0.4.x.
    # Release tags are deliberately absent — a tag push stages a draft GitHub release (see the
    # cli-release job), and publishing that draft fires release-publish.yml, which is where every
    # release-tag Sonatype upload now lives. This job publishing on a tag as well would put an
    # irreversible Maven Central upload before the human promotion gate.
    #
    # Two clauses stand the snapshot upload down. The repository variable
    # MORPHIR_RELEASE_MAVEN_CENTRAL — unset or anything other than "false" meaning enabled,
    # matching the MORPHIR_CI_PACKAGE_* switches — turns Maven Central publishing off from
    # repository settings without a commit. The maven_central dispatch input turns it off for one
    # manual run. On every other event the input is absent, so the event-name guard keeps the
    # clause true.
    if: github.repository == 'finos/morphir-scala' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/0.4.x') && vars.MORPHIR_RELEASE_MAVEN_CENTRAL != 'false' && (github.event_name != 'workflow_dispatch' || inputs.maven_central)
    needs: [ci]

    # Without this the job inherits GitHub's six-hour default. An `apt-get update` wedged against
    # unreachable Ubuntu mirrors held this job — and the whole run, including its logs — open for
    # over half an hour with no upload attempted; six hours is not a useful thing to wait for.
    timeout-minutes: 60

    runs-on: ubuntu-latest

    # only run one publish job for the same sha at the same time
    # e.g. when a main-branch push is also tagged
    concurrency: publish-sonatype-${{ github.sha }}

    env:
      LANG: "en_US.UTF-8"
      LC_MESSAGES: "en_US.UTF-8"
      LC_ALL: "en_US.UTF-8"

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin

      - name: Cache scala dependencies
        uses: coursier/cache-action@v8

      - name: Install native dependencies
        # Bounded: run 32158142566 spent this job's entire 60-minute budget inside `apt-get update`
        # against azure.archive.ubuntu.com. The shared script skips that mirror; timeout-minutes is
        # the backstop if retrying still cannot finish.
        timeout-minutes: 6
        run: .github/scripts/install-native-deps.sh

      - name: Restore JVM Build Output From Cache
        uses: actions/cache/restore@v6
        with:
          path: |
            out/morphir/**/jvm/
          key: ${{ runner.os }}-mill-jvm-25-${{ github.sha }}

      - name: Restore JS Build Output From Cache (platform)
        # test-js and test-js-desktop (morphir-oyn) save under two distinct keys — see their own
        # "Cache JS build output" steps — so both are restored here to get the full tree back.
        uses: actions/cache/restore@v6
        with:
          path: |
            out/morphir/**/js/
          key: ${{ runner.os }}-mill-js-platform-25-${{ github.sha }}

      - name: Restore JS Build Output From Cache (desktop)
        uses: actions/cache/restore@v6
        with:
          path: |
            out/morphir/**/js/
          key: ${{ runner.os }}-mill-js-desktop-25-${{ github.sha }}

      - name: Configure snapshot version
        if: github.ref == 'refs/heads/main'
        run: |
          echo "MORPHIR_PUBLISH_MODE=snapshot" >> "$GITHUB_ENV"
          echo "MORPHIR_PUBLISH_BRANCH=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Release
        env:
          # Sonatype credentials
          SONATYPE_USERNAME: ${{ secrets.ORG_MORPHIR_MAVEN_DEPLOY_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.ORG_MORPHIR_MAVEN_DEPLOY_PASSWORD }}
          # GPG signing credentials (using ORG_MORPHIR_CI keys)
          GPG_PRIVATE_KEY: ${{ secrets.ORG_MORPHIR_CI_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.ORG_MORPHIR_CI_GPG_PASSPHRASE }}
        run: |
          # Task.env is snapshotted at mill start. Convert GPG_* / SONATYPE_* in a first mill,
          # source the file, then start the release command so MILL_* is in that process env.
          # Do not mill show the file: it contains secrets.
          envfile="${RUNNER_TEMP:-/tmp}/mill-publish.env"
          trap 'rm -f "$envfile"' EXIT
          ./mill --ticker false -i ci.sonatype.writeMillEnv --path "$envfile"
          set -a
          # shellcheck disable=SC1090
          source "$envfile"
          set +a
          # Branch pushes (main, 0.4.x) are the snapshot case and publish every area — libraries
          # and plugins — each stamped from its own changelog, via ci.publish. Release tags never
          # reach this job (see its guard); ci.sonatype.libraries runs from release-publish.yml.
          ./mill --ticker false -i ci.publish

  ci:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [commit-authorship, lint, squire-policy, knowledge-base, test-js, test-js-desktop, test-jvm, test-native, mill-morphir-unit, mill-morphir-integration, morphir-elm-projects, runtime-generated-fixtures, runtime-tests]
    steps:
      - name: Verify required CI jobs succeeded
        run: |
          test "${{ needs.commit-authorship.result }}" = "success"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.squire-policy.result }}" = "success"
          test "${{ needs.knowledge-base.result }}" = "success"
          test "${{ needs.test-js.result }}" = "success"
          test "${{ needs.test-js-desktop.result }}" = "success"
          test "${{ needs.test-jvm.result }}" = "success"
          test "${{ needs.test-native.result }}" = "success"
          test "${{ needs.mill-morphir-unit.result }}" = "success"
          test "${{ needs.mill-morphir-integration.result }}" = "success"
          test "${{ needs.morphir-elm-projects.result }}" = "success"
          test "${{ needs.runtime-generated-fixtures.result }}" = "success"
          test "${{ needs.runtime-tests.result }}" = "success"
      - name: Aggregate of lint, and all tests
        run: echo "ci passed"

  packaging:
    # Desktop packaging (desktop-matrix/-package/-verify) retired with the Electron UI — the
    # desktop/web UI now lives at finos/morphir-ui — leaving this job as the CLI packaging
    # aggregate alone.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [cli-matrix, cli-package-native, cli-package-jvm, cli-verify]
    steps:
      - name: Verify CLI packaging jobs succeeded, or stood down together
        run: |
          matrix='${{ needs.cli-matrix.result }}'
          native='${{ needs.cli-package-native.result }}'
          jvm='${{ needs.cli-package-jvm.result }}'
          verify='${{ needs.cli-verify.result }}'
          echo "cli-matrix=$matrix cli-package-native=$native cli-package-jvm=$jvm cli-verify=$verify"
          if [[ "$matrix" == "skipped" ]]; then
            [[ "$native" == "skipped" && "$jvm" == "skipped" && "$verify" == "skipped" ]]
          else
            [[ "$matrix" == "success" && "$native" == "success" && "$jvm" == "success" && "$verify" == "success" ]]
          fi
      - name: Aggregate of release packaging
        run: echo "packaging passed"
