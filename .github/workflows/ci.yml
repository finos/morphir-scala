name: CI

env:
  JDK_JAVA_OPTIONS: -XX:+PrintCommandLineFlags -Xss10M # JDK_JAVA_OPTIONS is _the_ env. variable to use for modern Java
  JVM_OPTS: -XX:+PrintCommandLineFlags -Xss10M # for Java 8 only (sadly, it is not modern enough for JDK_JAVA_OPTIONS)

on:
  pull_request:
    branches: ["main", "0.4.x", "develop"]
  push:
    branches: ["main", "0.4.x", "develop"]
  release:
    types:
      - published
  workflow_dispatch:

# cancel older runs of a pull request;
# this will not cancel anything for normal git pushes
concurrency:
  group: cancel-old-pr-runs-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Scala and Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8
      - name: Lint code
        run: ./mill --ticker false -i ci.lint

  squire-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
      - name: Setup Scala and Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8
      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
      - name: Test Squire and release policy
        run: mise run test:squire

  knowledge-base:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Scala and Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8
      # The kb skill is a self-contained Mill script; it needs a JVM and nothing else.
      # Provenance checks are skipped: they compare against reference checkouts under
      # .refs/, which is gitignored and therefore absent on a runner.
      # Mill resolves its workspace from the working directory, so this must run from the skill directory —
      # invoking the launcher from the repo root picks up the root build instead and resolves nothing.
      - name: Test the kb skill
        run: cd .claude/skills/kb && ./mill --ticker false KbTests.scala
      - name: Check knowledge base and intent
        run: |
          .claude/skills/kb/kb check --no-provenance
          .claude/skills/kb/kb intent check
      # Mirrored upstream sources are compared against sync.lock.yaml only. The other half of the comparison needs
      # .refs/, which is gitignored and absent here — same reason provenance is skipped above. What this does catch
      # is a mirrored file edited into a state it could not be exported from, which is the failure that matters.
      - name: Check mirrored upstream sources
        run: .claude/skills/kb/kb sync status --no-upstream --strict

  mill-morphir-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Scala and Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8
      - name: Cache verified Morphir tool downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/morphir-scala
          key: ${{ runner.os }}-morphir-tools-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}
      - name: Cache Mill capability outputs
        uses: actions/cache@v6
        with:
          path: |
            out/mill-plugins/morphir/
            !out/mill-plugins/morphir/**/testForked.dest/**
            !out/mill-plugins/morphir/**/testOnly.dest/**
          key: ${{ runner.os }}-mill-morphir-unit-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}-${{ github.sha }}
      - name: Run capability
        run: ./mill --ticker false -i -k 'mill-plugins.morphir.{toolchain,javascript,elm-tooling,core,elm}.__.test'

  mill-morphir-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [mill-morphir-unit]
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Scala and Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8
      - name: Cache verified Morphir tool downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/morphir-scala
          key: ${{ runner.os }}-morphir-tools-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}
      - name: Cache Mill capability outputs
        uses: actions/cache@v6
        with:
          path: |
            out/mill-plugins/morphir/
            !out/mill-plugins/morphir/**/testForked.dest/**
            !out/mill-plugins/morphir/**/testOnly.dest/**
          key: ${{ runner.os }}-mill-morphir-unit-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}-${{ github.sha }}
      - name: Run capability
        run: ./mill --ticker false -i mill-plugins.morphir.integration.test

  morphir-elm-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [mill-morphir-unit]
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Scala and Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8
      - name: Cache verified Morphir tool downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/morphir-scala
          key: ${{ runner.os }}-morphir-tools-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}
      - name: Restore Mill plugin outputs
        uses: actions/cache/restore@v6
        with:
          path: out/mill-plugins/morphir/
          key: ${{ runner.os }}-mill-morphir-unit-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}-${{ github.sha }}
      - name: Cache Mill capability outputs
        uses: actions/cache@v6
        with:
          path: |
            out/examples/morphir-elm-projects/
            out/morphir-elm/
          key: ${{ runner.os }}-mill-morphir-projects-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}-${{ github.sha }}
      - name: Run capability
        # morphir-elm's CLI intermittently dies with a fatal EBADF fd-close-on-GC crash
        # under Node 24 after generation succeeds (bead morphir-qki, finos/morphir-elm#1282).
        # The preload shim swallows exactly that error shape; the trigger is run-scoped
        # (a bad runner host fails all in-job retries), so retries alone do not cover it.
        # Mill caches successful tasks, so each retry re-runs only the crashed ones.
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/.github/scripts/ebadf-close-shim.cjs
        run: |
          for attempt in 1 2 3; do
            if ./mill --ticker false -i -k "examples.morphir-elm-projects.__.morphirIR" \
              + "morphir-elm.sdks.__.morphirIR"; then
              exit 0
            fi
            echo "morphirIR attempt ${attempt} failed; retrying crashed tasks"
          done
          exit 1

  runtime-generated-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [morphir-elm-projects]
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Scala and Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8
      - name: Cache verified Morphir tool downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/morphir-scala
          key: ${{ runner.os }}-morphir-tools-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}
      - name: Restore generated Morphir IR outputs
        uses: actions/cache/restore@v6
        with:
          path: |
            out/examples/morphir-elm-projects/
            out/morphir-elm/
          key: ${{ runner.os }}-mill-morphir-projects-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}-${{ github.sha }}
      - name: Cache Mill capability outputs
        uses: actions/cache@v6
        with:
          path: out/morphir/runtime/classic/jvm/test/
          key: ${{ runner.os }}-mill-runtime-generated-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}-${{ github.sha }}
      - name: Run capability
        run: ./mill --ticker false -i morphir.runtime.classic.jvm.test.generatedRuntimeFixtures

  runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [runtime-generated-fixtures]
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Scala and Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8
      - name: Cache verified Morphir tool downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/morphir-scala
          key: ${{ runner.os }}-morphir-tools-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}
      - name: Restore generated Morphir IR outputs
        uses: actions/cache/restore@v6
        with:
          path: |
            out/examples/morphir-elm-projects/
            out/morphir-elm/
          key: ${{ runner.os }}-mill-morphir-projects-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}-${{ github.sha }}
      - name: Cache Mill capability outputs
        uses: actions/cache@v6
        with:
          path: out/morphir/runtime/classic/jvm/test/
          key: ${{ runner.os }}-mill-runtime-generated-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}-${{ github.sha }}
      - name: Run capability
        run: |
          ./mill --ticker false -i morphir.runtime.classic.jvm.test.verifyRuntimeTestDiscovery
          ./mill --ticker false -i morphir.runtime.classic.jvm.test

  test-js:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ["25"] # Note there is no need to actually run this for multiple JVM versions for JS
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Setup Scala and Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8

      - name: Run JS tests
        # Kept in step with .config/mise/tasks/test/js — the `wasm` link variants
        # sit beside their `js` sibling, so `morphir.__.js.__` never matches them.
        # `-j 4` matches that task; see the comment there for why the Scala.js
        # link phase needs a parallelism cap against the daemon's heap.
        run: |
          ./mill --ticker false -i -k -j 4 "morphir.__.js.__.compile" + "morphir.__.js.publishArtifacts" + "morphir.__.js.__.test" + "morphir.__.wasm.__.test"

      - name: Link the WebAssembly variants
        # Serial on purpose: a Wasm `fullLinkJS` holds the largest working set of any task in this
        # job, and running several at once exhausted the daemon heap inside the linker's
        # BinaryWriter. Splitting it out keeps the test phase parallel while the links go one at a
        # time. See .config/mise/tasks/test/js.
        run: |
          ./mill --ticker false -i -k -j 1 "morphir.__.wasm.fullLinkJS"

      - name: Cache JS build output
        # when in master repo: all commits to main branch and all additional tags
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/0.4.x' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@v6
        with:
          path: |
            out/morphir/**/js/
          # The commit already identifies the output; the key does not hash `out`.
          # `hashFiles('out')` follows the symlinks Mill leaves there — `out/mill-home`
          # points at $HOME and `out/mill-daemon/mill-workspace` back at the repo root —
          # so it walks the whole runner home and a cyclical path, taking minutes when it
          # works and failing the job outright when it hits an unreadable file or the cycle.
          key: ${{ runner.os }}-mill-js-${{matrix.java}}-${{ github.sha }}

  # Scala Native is currently scoped to the langkit and kit modules ported from
  # krueger, plus buildkit/core and prelude. It gets its own job rather than riding along
  # with test-jvm because it needs libuv and links a binary per test module,
  # which is slower than the JVM run and unrelated to it — a native linker
  # failure should be legible on its own.
  test-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ["25"]
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Scala and Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}

      - name: Cache scala dependencies
        uses: coursier/cache-action@v8

      - name: Install libuv
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev

      - name: Run Native tests
        # Kept in step with .config/mise/tasks/test/native — `-j 4` caps the
        # concurrent `nativeLink` tasks against the daemon's `-Xmx4g`.
        run: |
          ./mill --ticker false -i -k -j 4 "morphir.__.native.__.compile" + "morphir.__.native.publishArtifacts" + "morphir.__.native.__.test"

  test-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ["25"]
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Scala and Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Run JVM tests
        run: mise run test:jvm-platform

      - name: Cache JVM build output
        # when in master repo: all commits to main branch and all additional tags
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/0.4.x' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@v6
        with:
          path: |
            out/morphir/**/jvm/
            out/morphir/build/
          # See the JS job: the key deliberately does not hash `out`.
          key: ${{ runner.os }}-mill-jvm-${{matrix.java}}-${{ github.sha }}

  publish:
    # when in master repo: all commits to main branch and all additional tags
    if: github.repository == 'finos/morphir-scala' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/0.4.x' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/'))
    needs: [ci]

    runs-on: ubuntu-latest

    # only run one publish job for the same sha at the same time
    # e.g. when a main-branch push is also tagged
    concurrency: publish-sonatype-${{ github.sha }}

    env:
      LANG: "en_US.UTF-8"
      LC_MESSAGES: "en_US.UTF-8"
      LC_ALL: "en_US.UTF-8"

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Cache scala dependencies
        uses: coursier/cache-action@v8

      - name: Install libuv
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev

      - name: Restore JVM Build Output From Cache
        uses: actions/cache/restore@v6
        with:
          path: |
            out/morphir/**/jvm/
          key: ${{ runner.os }}-mill-jvm-25-${{ github.sha }}

      - name: Restore JS Build Output From Cache
        uses: actions/cache/restore@v6
        with:
          path: |
            out/morphir/**/js/
          key: ${{ runner.os }}-mill-js-25-${{ github.sha }}

      - name: Configure snapshot version
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: |
          echo "MORPHIR_PUBLISH_MODE=snapshot" >> "$GITHUB_ENV"
          echo "MORPHIR_PUBLISH_BRANCH=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Release
        env:
          # Sonatype credentials
          SONATYPE_USERNAME: ${{ secrets.ORG_MORPHIR_MAVEN_DEPLOY_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.ORG_MORPHIR_MAVEN_DEPLOY_PASSWORD }}
          # GPG signing credentials (using ORG_MORPHIR_CI keys)
          GPG_PRIVATE_KEY: ${{ secrets.ORG_MORPHIR_CI_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.ORG_MORPHIR_CI_GPG_PASSPHRASE }}
        run: |
          # Task.env is snapshotted at mill start. Convert GPG_* / SONATYPE_* in a first mill,
          # source the file, then start ci.publish so MILL_* is in that process env.
          # Do not mill show the file: it contains secrets.
          envfile="${RUNNER_TEMP:-/tmp}/mill-publish.env"
          trap 'rm -f "$envfile"' EXIT
          ./mill --ticker false -i ci.sonatype.writeMillEnv --path "$envfile"
          set -a
          # shellcheck disable=SC1090
          source "$envfile"
          set +a
          ./mill --ticker false -i ci.publish

  ci:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [lint, squire-policy, knowledge-base, test-js, test-jvm, test-native, mill-morphir-unit, mill-morphir-integration, morphir-elm-projects, runtime-generated-fixtures, runtime-tests]
    steps:
      - name: Verify required CI jobs succeeded
        run: |
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.squire-policy.result }}" = "success"
          test "${{ needs.knowledge-base.result }}" = "success"
          test "${{ needs.test-js.result }}" = "success"
          test "${{ needs.test-jvm.result }}" = "success"
          test "${{ needs.test-native.result }}" = "success"
          test "${{ needs.mill-morphir-unit.result }}" = "success"
          test "${{ needs.mill-morphir-integration.result }}" = "success"
          test "${{ needs.morphir-elm-projects.result }}" = "success"
          test "${{ needs.runtime-generated-fixtures.result }}" = "success"
          test "${{ needs.runtime-tests.result }}" = "success"
      - name: Aggregate of lint, and all tests
        run: echo "ci passed"
