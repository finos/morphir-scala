name: CI

env:
  JDK_JAVA_OPTIONS: -XX:+PrintCommandLineFlags -Xss10M # JDK_JAVA_OPTIONS is _the_ env. variable to use for modern Java
  JVM_OPTS: -XX:+PrintCommandLineFlags -Xss10M # for Java 8 only (sadly, it is not modern enough for JDK_JAVA_OPTIONS)

on:
  pull_request:
    branches: ["main", "0.4.x", "develop"]
  push:
    branches: ["main", "0.4.x", "develop"]
  release:
    types:
      - published
  workflow_dispatch:

# cancel older runs of a pull request;
# this will not cancel anything for normal git pushes
concurrency:
  group: cancel-old-pr-runs-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Scala and Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8
      - name: Lint code
        run: ./mill --ticker false -i ci.lint

  squire-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
      - name: Setup Scala and Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8
      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
      - name: Test Squire and release policy
        run: mise run test:squire

  knowledge-base:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Scala and Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8
      # The kb skill is a self-contained Mill script; it needs a JVM and nothing else.
      # Provenance checks are skipped: they compare against reference checkouts under
      # .refs/, which is gitignored and therefore absent on a runner.
      # Mill resolves its workspace from the working directory, so this must run from the skill directory —
      # invoking the launcher from the repo root picks up the root build instead and resolves nothing.
      - name: Test the kb skill
        run: cd .claude/skills/kb && ./mill --ticker false KbTests.scala
      - name: Check knowledge base and intent
        run: |
          .claude/skills/kb/kb check --no-provenance
          .claude/skills/kb/kb intent check
      # Mirrored upstream sources are compared against sync.lock.yaml only. The other half of the comparison needs
      # .refs/, which is gitignored and absent here — same reason provenance is skipped above. What this does catch
      # is a mirrored file edited into a state it could not be exported from, which is the failure that matters.
      - name: Check mirrored upstream sources
        run: .claude/skills/kb/kb sync status --no-upstream --strict

  mill-morphir-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Scala and Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8
      - name: Cache verified Morphir tool downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/morphir-scala
          key: ${{ runner.os }}-morphir-tools-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}
      - name: Cache Mill capability outputs
        uses: actions/cache@v6
        with:
          path: |
            out/mill-plugins/morphir/
            !out/mill-plugins/morphir/**/testForked.dest/**
            !out/mill-plugins/morphir/**/testOnly.dest/**
          key: ${{ runner.os }}-mill-morphir-unit-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}-${{ github.sha }}
      - name: Run capability
        run: ./mill --ticker false -i -k 'mill-plugins.morphir.{toolchain,javascript,elm-tooling,core,elm}.__.test'

  mill-morphir-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [mill-morphir-unit]
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Scala and Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8
      - name: Cache verified Morphir tool downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/morphir-scala
          key: ${{ runner.os }}-morphir-tools-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}
      - name: Cache Mill capability outputs
        uses: actions/cache@v6
        with:
          path: |
            out/mill-plugins/morphir/
            !out/mill-plugins/morphir/**/testForked.dest/**
            !out/mill-plugins/morphir/**/testOnly.dest/**
          key: ${{ runner.os }}-mill-morphir-unit-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}-${{ github.sha }}
      - name: Run capability
        run: ./mill --ticker false -i mill-plugins.morphir.integration.test

  morphir-elm-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [mill-morphir-unit]
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Scala and Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8
      - name: Cache verified Morphir tool downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/morphir-scala
          key: ${{ runner.os }}-morphir-tools-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}
      - name: Restore Mill plugin outputs
        uses: actions/cache/restore@v6
        with:
          path: out/mill-plugins/morphir/
          key: ${{ runner.os }}-mill-morphir-unit-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}-${{ github.sha }}
      - name: Cache Mill capability outputs
        uses: actions/cache@v6
        with:
          path: |
            out/examples/morphir-elm-projects/
            out/morphir-elm/
          key: ${{ runner.os }}-mill-morphir-projects-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}-${{ github.sha }}
      - name: Run capability
        # morphir-elm's CLI intermittently dies with a fatal EBADF fd-close-on-GC crash
        # under Node 24 after generation succeeds (bead morphir-qki, finos/morphir-elm#1282).
        # The preload shim swallows exactly that error shape; the trigger is run-scoped
        # (a bad runner host fails all in-job retries), so retries alone do not cover it.
        # Mill caches successful tasks, so each retry re-runs only the crashed ones.
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/.github/scripts/ebadf-close-shim.cjs
        run: |
          for attempt in 1 2 3; do
            if ./mill --ticker false -i -k "examples.morphir-elm-projects.__.morphirIR" \
              + "morphir-elm.sdks.__.morphirIR"; then
              exit 0
            fi
            echo "morphirIR attempt ${attempt} failed; retrying crashed tasks"
          done
          exit 1

  runtime-generated-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [morphir-elm-projects]
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Scala and Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8
      - name: Cache verified Morphir tool downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/morphir-scala
          key: ${{ runner.os }}-morphir-tools-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}
      - name: Restore generated Morphir IR outputs
        uses: actions/cache/restore@v6
        with:
          path: |
            out/examples/morphir-elm-projects/
            out/morphir-elm/
          key: ${{ runner.os }}-mill-morphir-projects-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}-${{ github.sha }}
      - name: Cache Mill capability outputs
        uses: actions/cache@v6
        with:
          path: out/morphir/runtime/classic/jvm/test/
          key: ${{ runner.os }}-mill-runtime-generated-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}-${{ github.sha }}
      - name: Run capability
        run: ./mill --ticker false -i morphir.runtime.classic.jvm.test.generatedRuntimeFixtures

  runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [runtime-generated-fixtures]
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Scala and Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8
      - name: Cache verified Morphir tool downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/morphir-scala
          key: ${{ runner.os }}-morphir-tools-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}
      - name: Restore generated Morphir IR outputs
        uses: actions/cache/restore@v6
        with:
          path: |
            out/examples/morphir-elm-projects/
            out/morphir-elm/
          key: ${{ runner.os }}-mill-morphir-projects-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}-${{ github.sha }}
      - name: Cache Mill capability outputs
        uses: actions/cache@v6
        with:
          path: out/morphir/runtime/classic/jvm/test/
          key: ${{ runner.os }}-mill-runtime-generated-${{ hashFiles('.mill-version', 'mill-plugins/morphir/toolchain/src/**', 'mill-plugins/morphir/javascript/src/**', 'mill-plugins/morphir/elm-tooling/src/**', 'mill-plugins/morphir/elm/test-tools/morphir-elm/package-lock.json') }}-${{ github.sha }}
      - name: Run capability
        run: |
          ./mill --ticker false -i morphir.runtime.classic.jvm.test.verifyRuntimeTestDiscovery
          ./mill --ticker false -i morphir.runtime.classic.jvm.test

  # Split from test-js-desktop (morphir-oyn): linking morphir.ui, morphir.desktop and
  # morphir.appkit.electron alongside the rest of the JS/Wasm tree in one Mill daemon pushed the
  # Scala.js linker past the 8 GB heap in .mill-jvm-opts, OOM-ing inside the source-map printer.
  # ci.testJs / ci.testJsWasmLink (ci/MorphirCi.mill) resolve the shared wildcards once and split
  # them by millbuild.JsTestSelectors so the two peaks land on two runners with two daemons; "platform"
  # here is everything *except* the desktop/UI subset that test-js-desktop takes.
  test-js:
    runs-on: ubuntu-latest
    # 45 rather than the 30 the other test jobs use. The "Run JS tests" step alone has finished in
    # under 15 minutes and has also exceeded 30 on the same branch with no JS sources changed, and a
    # timed-out job is reported as *cancelled*, which reads like an unrelated failure. Pull requests
    # always pay a cold build here: the JS build cache is keyed by the exact commit SHA and is only
    # saved on main, develop, 0.4.x and tags, so a PR can never restore it.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: ["25"] # Note there is no need to actually run this for multiple JVM versions for JS
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Setup Scala and Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8

      - name: Run JS tests
        # Kept in step with .config/mise/tasks/test/js for the underlying selectors, but `-j 2`
        # rather than that task's `-j 4` default: a GitHub-hosted runner is smaller than a developer
        # machine and shares its 8 GB daemon heap (.mill-jvm-opts) with everything else on the box.
        # ci.testJs partitions the shared wildcard by millbuild.JsTestSelectors; "platform" is every
        # JS/Wasm test module except morphir.ui/morphir.desktop/morphir.appkit.electron, which
        # test-js-desktop covers instead.
        run: |
          ./mill --ticker false -i -k -j 2 ci.testJs --group platform

      - name: Link the WebAssembly variants
        # Serial on purpose: a Wasm `fullLinkJS` holds the largest working set of any task in this
        # job, and running several at once exhausted the daemon heap inside the linker's
        # BinaryWriter. Splitting it out keeps the test phase parallel while the links go one at a
        # time. See .config/mise/tasks/test/js.
        run: |
          ./mill --ticker false -i -k -j 1 ci.testJsWasmLink --group platform

      - name: Cache JS build output
        # when in master repo: all commits to main branch and all additional tags
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/0.4.x' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@v6
        with:
          path: |
            out/morphir/**/js/
          # The commit already identifies the output; the key does not hash `out`.
          # `hashFiles('out')` follows the symlinks Mill leaves there — `out/mill-home`
          # points at $HOME and `out/mill-daemon/mill-workspace` back at the repo root —
          # so it walks the whole runner home and a cyclical path, taking minutes when it
          # works and failing the job outright when it hits an unreadable file or the cycle.
          # `-platform` distinguishes this from test-js-desktop's own save under the same commit.
          key: ${{ runner.os }}-mill-js-platform-${{matrix.java}}-${{ github.sha }}

  # See test-js above for why this job exists (morphir-oyn): morphir.ui, morphir.desktop and
  # morphir.appkit.electron are the desktop/UI half of the same JS/Wasm wildcard, split out by
  # ci.testJs --group desktop so their link load lands on its own runner and daemon.
  test-js-desktop:
    runs-on: ubuntu-latest
    # Kept in step with test-js's own reasoning for 45 rather than 30.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: ["25"] # Note there is no need to actually run this for multiple JVM versions for JS
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Setup Scala and Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8

      - name: Run JS tests (desktop/UI)
        # See test-js's "Run JS tests" step for the `-j 2` reasoning. "desktop" is
        # morphir.ui/morphir.desktop/morphir.appkit.electron, the subset test-js excludes.
        run: |
          ./mill --ticker false -i -k -j 2 ci.testJs --group desktop

      - name: Link the WebAssembly variants (desktop/UI)
        # Serial for the same reason as test-js's own Wasm link step.
        run: |
          ./mill --ticker false -i -k -j 1 ci.testJsWasmLink --group desktop

      - name: Cache JS build output
        # when in master repo: all commits to main branch and all additional tags
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/0.4.x' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@v6
        with:
          path: |
            out/morphir/**/js/
          # See test-js's own cache step; `-desktop` distinguishes this save under the same commit.
          key: ${{ runner.os }}-mill-js-desktop-${{matrix.java}}-${{ github.sha }}

  # Scala Native is currently scoped to the langkit and kit modules ported from
  # krueger, plus buildkit/core and prelude. It gets its own job rather than riding along
  # with test-jvm because it needs libuv and links a binary per test module,
  # which is slower than the JVM run and unrelated to it — a native linker
  # failure should be legible on its own.
  test-native:
    runs-on: ubuntu-latest
    # 45 rather than 30, for the same reason test-js carries 45. This job finishes in about fifteen
    # minutes on a warm cache and exceeded thirty on a coursier cache miss, with no OutOfMemoryError
    # in the log — lowering the link concurrency to `-j 2` cured the heap exhaustion and left
    # wall-clock as the binding constraint. A timed-out job is reported as *cancelled*, which reads
    # like an unrelated infrastructure failure rather than a job that needed more minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: ["25"]
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Scala and Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}

      - name: Cache scala dependencies
        uses: coursier/cache-action@v8

      - name: Install libuv
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev

      # Reuse of this job's own native build output. Unlike test-js's cache, which is save-only and
      # restored by `publish` rather than by test-js itself, this both restores and saves, so a
      # re-run of the same commit does not relink from scratch — the case that follows a timeout or
      # an infrastructure flake, which is how bead morphir-dru was opened.
      #
      # It is deliberately exact-commit only. See the key below for what happened when it was not.
      - name: Cache Native build output
        uses: actions/cache@v6
        with:
          path: |
            out/morphir/**/native/
          # Keyed by the exact commit, with no restore-keys fallback. A cross-commit restore was
          # tried and reverted: it made this job reuse a `nativeLink` from a different commit, and
          # 11 GithubClientTests snapshot assertions failed because a stale binary ran against
          # current sources. The first run of that branch passed (empty cache) and the second failed
          # (restored the first's output) — same configuration, so the restore was the only
          # variable. Mill's own input hashing does not protect against this, because the restored
          # task metadata is what tells Mill the work is already done.
          #
          # What remains is reuse across re-runs of the same commit, which is exactly the case that
          # follows a timeout or an infrastructure flake. Cold runs stay cold; see bead morphir-dru.
          key: ${{ runner.os }}-mill-native-${{ matrix.java }}-${{ github.sha }}

      - name: Run Native tests
        # Kept in step with .config/mise/tasks/test/native for the selectors, but `-j 2` rather than
        # that task's `-j 4`: every `nativeLink` runs inside the one Mill daemon and holds a full
        # linker working set, so the constraint is that daemon's `-Xmx8g` (.mill-jvm-opts), and 8 GB
        # is already half of a 16 GB GitHub-hosted runner. At `-j 4` this job died with
        # `java.lang.OutOfMemoryError: Java heap space` and then sat until the 30-minute job timeout,
        # which GitHub reports as *cancelled* rather than failed. Same reasoning as the JS jobs.
        run: |
          ./mill --ticker false -i -k -j 2 "morphir.__.native.__.compile" + "morphir.__.native.publishArtifacts" + "morphir.__.native.__.test"

  test-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ["25"]
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Scala and Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}
      - name: Cache scala dependencies
        uses: coursier/cache-action@v8

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Run JVM tests
        run: mise run test:jvm-platform

      - name: Cache JVM build output
        # when in master repo: all commits to main branch and all additional tags
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/0.4.x' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@v6
        with:
          path: |
            out/morphir/**/jvm/
            out/morphir/build/
          # See the JS job: the key deliberately does not hash `out`.
          key: ${{ runner.os }}-mill-jvm-${{matrix.java}}-${{ github.sha }}

  desktop-matrix:
    # Tags and published releases always package all five platforms, ignoring the switch below —
    # turning off ordinary-CI packaging must never weaken a real release. A push to main, develop or
    # 0.4.x also packages all five; everything else (a pull request) packages linux-amd64 alone. This
    # job just computes which; desktop-package and desktop-verify consume its outputs.
    #
    # Gated by the repository variable MORPHIR_CI_PACKAGE_DESKTOP, unset or anything other than
    # "false" meaning enabled, so packaging runs today without anyone creating the variable and a
    # maintainer can disable it from repository settings without a commit. It must be `vars`, not a
    # workflow-level `env:` — GitHub Actions does not expose the `env` context inside a job-level
    # `if:` condition, so an `env:`-based switch would silently evaluate empty there and this job
    # (and everything gated on it) would never run.
    if: github.repository == 'finos/morphir-scala' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || vars.MORPHIR_CI_PACKAGE_DESKTOP != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      platforms: ${{ steps.matrix.outputs.platforms }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Compute the packaging matrix
        id: matrix
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* || "$GITHUB_EVENT_NAME" == "release" || "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == "refs/heads/develop" || "$GITHUB_REF" == "refs/heads/0.4.x" ]]; then
            MATRIX='{"include":[{"token":"mac-aarch64","runner":"macos-14"},{"token":"mac-amd64","runner":"macos-15-intel"},{"token":"linux-amd64","runner":"ubuntu-24.04"},{"token":"linux-aarch64","runner":"ubuntu-24.04-arm"},{"token":"win-amd64","runner":"windows-latest"}]}'
            PLATFORMS="mac-aarch64,mac-amd64,linux-amd64,linux-aarch64,win-amd64"
          else
            # A pull request packages one leg per operating system: linux-amd64, win-amd64 and
            # mac-aarch64. Each covers machinery the others do not — fpm and AppImage on Linux, Git
            # Bash and mill.bat and NSIS on Windows, code signing and dmg on macOS — and all three
            # of those areas have produced a real packaging failure. What a pull request defers is
            # only the second architecture of an already-covered operating system, mac-amd64 and
            # linux-aarch64, which a push to a release branch still exercises.
            MATRIX='{"include":[{"token":"linux-amd64","runner":"ubuntu-24.04"},{"token":"win-amd64","runner":"windows-latest"},{"token":"mac-aarch64","runner":"macos-14"}]}'
            PLATFORMS="linux-amd64,win-amd64,mac-aarch64"
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "platforms=$PLATFORMS" >> "$GITHUB_OUTPUT"

      # Resolved once, here, rather than on each packaging runner. Two reasons: every leg then
      # stamps the identical version, where five independent resolves could disagree across a
      # commit boundary; and Windows never has to run Mill for this, since the ./mill launcher
      # supports only Linux and macOS and exits 1 anywhere else.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Cache scala dependencies
        uses: coursier/cache-action@v8

      - name: Resolve the publish version
        id: version
        shell: bash
        # `mill show` is not guaranteed to put the value alone on stdout, so take the last line and
        # strip the JSON quotes; an empty result is a failure rather than a blank version carried
        # into electron-builder, where it would surface as a confusing packaging error.
        run: |
          version="$(./mill --ticker false -i show ci.desktop.version | tail -n 1 | tr -d '"')"
          if [[ -z "$version" ]]; then
            echo "ci.desktop.version resolved to an empty string" >&2
            exit 1
          fi
          echo "resolved desktop version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  desktop-package:
    # Desktop binaries ship on tags and published releases only regardless of the switch. Ordinary
    # pushes and pull requests package too, gated by MORPHIR_CI_PACKAGE_DESKTOP (see desktop-matrix
    # above), so a change that breaks electron-builder, the Scala.js link or canonicalization is
    # caught in ordinary CI rather than at release time.
    if: github.repository == 'finos/morphir-scala' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || vars.MORPHIR_CI_PACKAGE_DESKTOP != 'false')
    needs: [ci, desktop-matrix]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.desktop-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache scala dependencies
        uses: coursier/cache-action@v8

      - name: Package
        shell: bash
        env:
          # electron-builder signs when these are present and builds unsigned when they are absent.
          CSC_LINK: ${{ secrets.ORG_MORPHIR_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.ORG_MORPHIR_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.ORG_MORPHIR_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.ORG_MORPHIR_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.ORG_MORPHIR_APPLE_TEAM_ID }}
        run: ./morphir/desktop/scripts/package.sh "${{ matrix.token }}" "${{ needs.desktop-matrix.outputs.version }}"

      - name: Upload raw packaging output
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.token }}
          # electron-builder also leaves unpacked app trees (mac-arm64/, linux-unpacked/, …) next to the
          # archives and installers; only the distributable extensions are wanted downstream, and the glob
          # keeps the files directly under the artifact root to match the desktop-release staging contract.
          path: |
            morphir/desktop/app/release/*.zip
            morphir/desktop/app/release/*.tar.gz
            morphir/desktop/app/release/*.dmg
            morphir/desktop/app/release/*.exe
            morphir/desktop/app/release/*.AppImage
            morphir/desktop/app/release/*.deb
          if-no-files-found: error

  desktop-verify:
    # Runs whenever packaging ran (see desktop-matrix above): tags and published releases always,
    # ordinary pushes and pull requests when the switch is enabled. No signing and no uploads happen
    # here — this job only proves the packaged subset canonicalizes and passes the pre-publish checks,
    # with the signature check relaxed the same way a local `ci.desktop.all` run relaxes it, since
    # there is no GPG signing step and no secrets outside a release.
    if: github.repository == 'finos/morphir-scala' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || vars.MORPHIR_CI_PACKAGE_DESKTOP != 'false')
    needs: [desktop-matrix, desktop-package]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      LANG: "en_US.UTF-8"
      LC_MESSAGES: "en_US.UTF-8"
      LC_ALL: "en_US.UTF-8"
      MORPHIR_DESKTOP_STAGING_DIR: .dev/dist/desktop/staging
      MORPHIR_DESKTOP_RELEASE_DIR: .dev/dist/desktop/release

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Cache scala dependencies
        uses: coursier/cache-action@v8

      - name: Download packaging output
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: ${{ env.MORPHIR_DESKTOP_STAGING_DIR }}

      # Same normalization desktop-release does: download-artifact names each directory after the
      # artifact (desktop-<token>); the staging contract is <root>/<token>.
      - name: Normalize staging layout
        run: |
          cd "$MORPHIR_DESKTOP_STAGING_DIR"
          for directory in desktop-*; do
            mv "$directory" "${directory#desktop-}"
          done
          ls -R .

      - name: Canonicalize the packaged subset
        run: ./mill --ticker false -i ci.desktop.canonicalize --platforms "${{ needs.desktop-matrix.outputs.platforms }}"

      - name: Verify the packaged subset (no signature — nothing signs it outside a release)
        run: ./mill --ticker false -i ci.desktop.verify --require-signature false --platforms "${{ needs.desktop-matrix.outputs.platforms }}"

  desktop-release:
    if: github.repository == 'finos/morphir-scala' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release')
    needs: [ci, packaging]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The workflow default is contents: read, which cannot upload release assets.
    permissions:
      contents: write

    concurrency: publish-desktop-${{ github.sha }}

    env:
      LANG: "en_US.UTF-8"
      LC_MESSAGES: "en_US.UTF-8"
      LC_ALL: "en_US.UTF-8"
      MORPHIR_DESKTOP_STAGING_DIR: .dev/dist/desktop/staging
      MORPHIR_DESKTOP_RELEASE_DIR: .dev/dist/desktop/release

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Cache scala dependencies
        uses: coursier/cache-action@v8

      - name: Download packaging output
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: ${{ env.MORPHIR_DESKTOP_STAGING_DIR }}

      # download-artifact names each directory after the artifact (desktop-<token>); the staging
      # contract is <root>/<token>, so strip the prefix.
      - name: Normalize staging layout
        run: |
          cd "$MORPHIR_DESKTOP_STAGING_DIR"
          for directory in desktop-*; do
            mv "$directory" "${directory#desktop-}"
          done
          ls -R .

      - name: Canonicalize assets and write checksums
        run: ./mill --ticker false -i ci.desktop.canonicalize

      - name: Sign checksums.txt
        env:
          GPG_PRIVATE_KEY: ${{ secrets.ORG_MORPHIR_CI_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.ORG_MORPHIR_CI_GPG_PASSPHRASE }}
        run: |
          # The org secret's encoding is not documented, so accept the same three forms
          # PgpSecret.toMillBase64 accepts (mill-plugins/morphir/core/src/org/finos/morphir/mill/publish/PgpSecret.scala):
          # ASCII-armored plaintext, base64-of-armor, or base64-of-binary. A plain `base64 --decode`
          # would fail fast under `-e -o pipefail` if the secret is armored plaintext.
          if printf '%s' "$GPG_PRIVATE_KEY" | grep -q "BEGIN PGP PRIVATE KEY"; then
            printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          else
            printf '%s' "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          fi
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --detach-sign --armor "$MORPHIR_DESKTOP_RELEASE_DIR/checksums.txt"

      # Runs after signing (so checksums.txt.asc exists) and before either upload, with the default
      # requireSignature = true: this is the one place the signature check can run, since neither
      # ci.desktop.canonicalize nor a local ci.desktop.all run produces checksums.txt.asc.
      - name: Verify release assets
        run: ./mill --ticker false -i ci.desktop.verify

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          ./mill --ticker false -i ci.desktop.githubRelease --tag "$TAG"

      - name: Publish archives to Maven Central
        env:
          SONATYPE_USERNAME: ${{ secrets.ORG_MORPHIR_MAVEN_DEPLOY_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.ORG_MORPHIR_MAVEN_DEPLOY_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.ORG_MORPHIR_CI_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.ORG_MORPHIR_CI_GPG_PASSPHRASE }}
        run: |
          # Same two-process dance as the library publish: Task.env is snapshotted at mill start.
          envfile="${RUNNER_TEMP:-/tmp}/mill-publish.env"
          trap 'rm -f "$envfile"' EXIT
          ./mill --ticker false -i ci.sonatype.writeMillEnv --path "$envfile"
          set -a
          # shellcheck disable=SC1090
          source "$envfile"
          set +a
          ./mill --ticker false -i ci.desktop.sonatype

  publish:
    # when in master repo: all commits to main branch and all additional tags
    if: github.repository == 'finos/morphir-scala' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/0.4.x' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/'))
    needs: [ci]

    # Without this the job inherits GitHub's six-hour default. An `apt-get update` wedged against
    # unreachable Ubuntu mirrors held this job — and the whole run, including its logs — open for
    # over half an hour with no upload attempted; six hours is not a useful thing to wait for.
    timeout-minutes: 60

    runs-on: ubuntu-latest

    # only run one publish job for the same sha at the same time
    # e.g. when a main-branch push is also tagged
    concurrency: publish-sonatype-${{ github.sha }}

    env:
      LANG: "en_US.UTF-8"
      LC_MESSAGES: "en_US.UTF-8"
      LC_ALL: "en_US.UTF-8"

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Cache scala dependencies
        uses: coursier/cache-action@v8

      - name: Install libuv
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev

      - name: Restore JVM Build Output From Cache
        uses: actions/cache/restore@v6
        with:
          path: |
            out/morphir/**/jvm/
          key: ${{ runner.os }}-mill-jvm-25-${{ github.sha }}

      - name: Restore JS Build Output From Cache (platform)
        # test-js and test-js-desktop (morphir-oyn) save under two distinct keys — see their own
        # "Cache JS build output" steps — so both are restored here to get the full tree back.
        uses: actions/cache/restore@v6
        with:
          path: |
            out/morphir/**/js/
          key: ${{ runner.os }}-mill-js-platform-25-${{ github.sha }}

      - name: Restore JS Build Output From Cache (desktop)
        uses: actions/cache/restore@v6
        with:
          path: |
            out/morphir/**/js/
          key: ${{ runner.os }}-mill-js-desktop-25-${{ github.sha }}

      - name: Configure snapshot version
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: |
          echo "MORPHIR_PUBLISH_MODE=snapshot" >> "$GITHUB_ENV"
          echo "MORPHIR_PUBLISH_BRANCH=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Release
        env:
          # Sonatype credentials
          SONATYPE_USERNAME: ${{ secrets.ORG_MORPHIR_MAVEN_DEPLOY_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.ORG_MORPHIR_MAVEN_DEPLOY_PASSWORD }}
          # GPG signing credentials (using ORG_MORPHIR_CI keys)
          GPG_PRIVATE_KEY: ${{ secrets.ORG_MORPHIR_CI_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.ORG_MORPHIR_CI_GPG_PASSPHRASE }}
        run: |
          # Task.env is snapshotted at mill start. Convert GPG_* / SONATYPE_* in a first mill,
          # source the file, then start ci.publish so MILL_* is in that process env.
          # Do not mill show the file: it contains secrets.
          envfile="${RUNNER_TEMP:-/tmp}/mill-publish.env"
          trap 'rm -f "$envfile"' EXIT
          ./mill --ticker false -i ci.sonatype.writeMillEnv --path "$envfile"
          set -a
          # shellcheck disable=SC1090
          source "$envfile"
          set +a
          ./mill --ticker false -i ci.publish

  ci:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, squire-policy, knowledge-base, test-js, test-js-desktop, test-jvm, test-native, mill-morphir-unit, mill-morphir-integration, morphir-elm-projects, runtime-generated-fixtures, runtime-tests]
    steps:
      - name: Verify required CI jobs succeeded
        run: |
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.squire-policy.result }}" = "success"
          test "${{ needs.knowledge-base.result }}" = "success"
          test "${{ needs.test-js.result }}" = "success"
          test "${{ needs.test-js-desktop.result }}" = "success"
          test "${{ needs.test-jvm.result }}" = "success"
          test "${{ needs.test-native.result }}" = "success"
          test "${{ needs.mill-morphir-unit.result }}" = "success"
          test "${{ needs.mill-morphir-integration.result }}" = "success"
          test "${{ needs.morphir-elm-projects.result }}" = "success"
          test "${{ needs.runtime-generated-fixtures.result }}" = "success"
          test "${{ needs.runtime-tests.result }}" = "success"
      - name: Aggregate of lint, and all tests
        run: echo "ci passed"

  packaging:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [desktop-matrix, desktop-package, desktop-verify]
    steps:
      # Unlike `ci`, a skip can be legitimate here — MORPHIR_CI_PACKAGE_DESKTOP=false stands the whole
      # phase down outside a tag or release. But a skip is ambiguous on its own: desktop-package also
      # skips when `ci` fails upstream, and that must not read as green. desktop-matrix is what
      # disambiguates. It is gated by the switch and depends on nothing else, so:
      #
      #   desktop-matrix skipped  -> the switch is off; every member must be skipped together.
      #   desktop-matrix ran      -> packaging was expected to run; a skip below it is a cascade from
      #                              an upstream failure, and only success is acceptable.
      #
      # Failure and cancellation are never acceptable in either branch.
      - name: Verify packaging jobs succeeded, or stood down together
        run: |
          matrix='${{ needs.desktop-matrix.result }}'
          package='${{ needs.desktop-package.result }}'
          verify='${{ needs.desktop-verify.result }}'
          echo "desktop-matrix=$matrix desktop-package=$package desktop-verify=$verify"
          if [[ "$matrix" == "skipped" ]]; then
            [[ "$package" == "skipped" && "$verify" == "skipped" ]]
          else
            [[ "$matrix" == "success" && "$package" == "success" && "$verify" == "success" ]]
          fi
      - name: Aggregate of desktop packaging
        run: echo "packaging passed"
