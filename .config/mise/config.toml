# Mise configuration for morphir-scala project
# https://mise.jdx.dev/configuration.html
#
# Tasks are defined as bash scripts in .config/mise/tasks/
# Run `mise tasks` to see available tasks

[tools]
bun = "1.4.4"
node = "26.13.0"
"scala-cli" = "1.18.0"

# JSON Schema CLI (https://github.com/sourcemeta/jsonschema). Only used against the IR schemas mirrored into
# kb/bundles/morphir/morphir-upstream/, by the export gauntlet in the squire skill. finos/morphir pins it the same
# way and gates its own pushes on it, so an export prepared without it would be checked by nothing until a
# maintainer noticed.
jsonschema = "latest"

# Shared OpenSpec workflow; Node keeps the repository's existing pin.
"npm:@fission-ai/openspec" = "1.16.0"

# The shared snapshot checker is a standalone MoonBit development tool.
[tools."http:moonbit"]
version = "0.10.15+943464bfa"
bin_path = "bin"

[tools."http:moonbit".platforms]
linux-x64 = { url = "https://cli.moonbitlang.com/binaries/0.10.15%2B943464bfa/moonbit-linux-x86_64.tar.gz" }
linux-arm64 = { url = "https://cli.moonbitlang.com/binaries/0.10.15%2B943464bfa/moonbit-linux-aarch64.tar.gz" }
macos-arm64 = { url = "https://cli.moonbitlang.com/binaries/0.10.15%2B943464bfa/moonbit-darwin-aarch64.tar.gz" }
macos-x64 = { url = "https://cli.moonbitlang.com/binaries/0.10.15%2B943464bfa/moonbit-darwin-x86_64.tar.gz" }
windows-x64 = { url = "https://cli.moonbitlang.com/binaries/0.10.15%2B943464bfa/moonbit-windows-x86_64.zip", format = "zip" }

[env]
_.path = ["./node_modules/.bin"]
