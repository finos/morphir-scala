# Mise configuration for morphir-scala project
# https://mise.jdx.dev/configuration.html
#
# Tasks are defined as bash scripts in .config/mise/tasks/
# Run `mise tasks` to see available tasks

[tools]
bun = "1.4.4"
node = "26.13.1"
"scala-cli" = "1.19.0"

# JSON Schema CLI (https://github.com/sourcemeta/jsonschema). Only used against the IR schemas mirrored into
# kb/bundles/morphir/morphir-upstream/, by the export gauntlet in the squire skill. finos/morphir pins it the same
# way and gates its own pushes on it, so an export prepared without it would be checked by nothing until a
# maintainer noticed.
jsonschema = "latest"

# Shared OpenSpec workflow; Node keeps the repository's existing pin.
"npm:@fission-ai/openspec" = "2.0.0"

# Shared OpenSpec snapshot checker and skill setup. A released binary, so a
# toolchain change elsewhere cannot break the openspec tasks. See
# https://github.com/moonrockz/mission-control/blob/tools-v0.1.1/apps/tools/README.md
[tools."github:moonrockz/mission-control"]
version = "0.1.1"
version_prefix = "tools-v"

[tools."github:moonrockz/mission-control".platforms]
linux-x64 = { asset_pattern = "mission-control-tools-linux-x64.tar.gz" }
linux-arm64 = { asset_pattern = "mission-control-tools-linux-arm64.tar.gz" }
macos-arm64 = { asset_pattern = "mission-control-tools-darwin-arm64.tar.gz" }
macos-x64 = { asset_pattern = "mission-control-tools-darwin-x64.tar.gz" }
windows-x64 = { asset_pattern = "mission-control-tools-windows-x64.zip" }
# No Windows arm64 build; Windows on Arm runs the x64 build under emulation.
windows-arm64 = { asset_pattern = "mission-control-tools-windows-x64.zip" }

[env]
_.path = ["./node_modules/.bin"]
